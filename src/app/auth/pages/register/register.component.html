<div class="auth-wrapper">
    <div class="auth-card glass-card animate-fade">
        <div class="auth-header">
            <i class="fas fa-user-plus auth-logo"></i>
            <h1>Create Account</h1>
            <p>Join SupplyChainX today</p>
        </div>

        <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="auth-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" [(ngModel)]="registerRequest.firstName" required
                        placeholder="John">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" [(ngModel)]="registerRequest.lastName" required
                        placeholder="Doe">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-container">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" [(ngModel)]="registerRequest.email" required
                        placeholder="name@company.com">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" [(ngModel)]="registerRequest.password" required
                        placeholder="••••••••">
                </div>
            </div>

            <div class="form-group">
                <label for="role">Requested Role</label>
                <div class="input-container">
                    <i class="fas fa-briefcase"></i>
                    <select id="role" name="role" [(ngModel)]="registerRequest.role" required>
                        <option *ngFor="let role of roles" [value]="role">{{ role.replace('_', ' ') }}</option>
                    </select>
                </div>
            </div>

            <div class="error-msg" *ngIf="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ errorMessage }}</span>
            </div>

            <button type="submit" class="btn btn-primary btn-block" [disabled]="!registerForm.form.valid || isLoading">
                <span *ngIf="!isLoading">Register Account</span>
                <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Creating...</span>
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a routerLink="/login">Log in here</a></p>
        </div>
    </div>
</div>
