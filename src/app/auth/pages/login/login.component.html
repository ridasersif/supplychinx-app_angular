<div class="auth-wrapper">
    <div class="auth-card glass-card animate-fade">
        <div class="auth-header">
            <i class="fas fa-boxes-stacked auth-logo"></i>
            <h1>Welcome Back</h1>
            <p>Log in to your SupplyChainX account</p>
        </div>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-container">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" [(ngModel)]="authRequest.email" required
                        placeholder="name@company.com">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" [(ngModel)]="authRequest.password" required
                        placeholder="••••••••">
                </div>
            </div>

            <div class="error-msg" *ngIf="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ errorMessage }}</span>
            </div>

            <button type="submit" class="btn btn-primary btn-block" [disabled]="!loginForm.form.valid || isLoading">
                <span *ngIf="!isLoading">Sign In</span>
                <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Processing...</span>
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a routerLink="/register">Register here</a></p>
        </div>
    </div>
</div>
