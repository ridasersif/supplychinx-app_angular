<div class="page-header">
    <div class="header-content">
        <h1>Customer Management</h1>
        <p>Manage your clients and their information</p>
    </div>
    <button class="btn btn-primary" routerLink="/dashboard/customers/new">
        <i class="fas fa-plus"></i>
        <span>Add New Customer</span>
    </button>
</div>

<div class="list-container glass-card animate-fade">
    <div class="list-actions">
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" [(ngModel)]="filterText" (input)="onSearch()"
                placeholder="Search customers by name or email...">
        </div>
    </div>

    <div class="table-responsive">
        <table class="premium-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th class="text-right">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let customer of customers">
                    <td>
                        <div class="customer-info">
                            <div class="avatar-sm">{{ customer.name.charAt(0).toUpperCase() }}</div>
                            <span class="customer-name">{{ customer.name }}</span>
                        </div>
                    </td>
                    <td>{{ customer.email }}</td>
                    <td>{{ customer.phone }}</td>
                    <td>{{ customer.address }}</td>
                    <td class="text-right">
                        <div class="action-buttons">
                            <button class="btn-icon" [routerLink]="['/dashboard/customers', customer.idCustomer]">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="btn-icon btn-icon-edit"
                                [routerLink]="['/dashboard/customers/edit', customer.idCustomer]">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-icon btn-icon-delete" (click)="deleteCustomer(customer.idCustomer!)">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                <tr *ngIf="customers.length === 0 && !isLoading">
                    <td colspan="5" class="text-center no-data">
                        <i class="fas fa-folder-open"></i>
                        <p>No customers found</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" *ngIf="totalElements > pageSize">
        <!-- Pagination controls would go here -->
    </div>
</div>
