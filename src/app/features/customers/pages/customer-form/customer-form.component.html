<div class="page-header">
    <div class="header-content">
        <h1>{{ isEditMode ? 'Edit Customer' : 'Add New Customer' }}</h1>
        <p>{{ isEditMode ? 'Update customer details' : 'Fill in the information to create a new customer' }}</p>
    </div>
</div>

<div class="form-wrapper glass-card animate-fade">
    <form (ngSubmit)="onSubmit()" #customerForm="ngForm" class="premium-form">
        <div class="form-section">
            <h3>Basic Information</h3>
            <div class="form-group">
                <label for="name">Full Name</label>
                <div class="input-container">
                    <i class="fas fa-user"></i>
                    <input type="text" id="name" name="name" [(ngModel)]="customer.name" required
                        placeholder="John Doe">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-container">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" [(ngModel)]="customer.email" required
                            placeholder="john@example.com">
                    </div>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-container">
                        <i class="fas fa-phone"></i>
                        <input type="text" id="phone" name="phone" [(ngModel)]="customer.phone"
                            placeholder="+212 600 000 000">
                    </div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3>Address Details</h3>
            <div class="form-group">
                <label for="address">Full Address</label>
                <div class="input-container text-area-container">
                    <i class="fas fa-map-marker-alt"></i>
                    <textarea id="address" name="address" [(ngModel)]="customer.address" required
                        placeholder="123 Street, City, Country" rows="3"></textarea>
                </div>
            </div>
        </div>

        <div class="error-msg" *ngIf="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ errorMessage }}</span>
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-outline" routerLink="/customers">Cancel</button>
            <button type="submit" class="btn btn-primary" [disabled]="!customerForm.form.valid || isLoading">
                <span *ngIf="!isLoading">{{ isEditMode ? 'Update Customer' : 'Create Customer' }}</span>
                <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Saving...</span>
            </button>
        </div>
    </form>
</div>
