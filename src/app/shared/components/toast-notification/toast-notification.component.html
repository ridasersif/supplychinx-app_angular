<div class="toast-container">
    <div *ngFor="let toast of notificationService.toasts$ | async" class="toast" [ngClass]="toast.type">
        <div class="toast-content">
            <i class="fas" [class.fa-check-circle]="toast.type === 'success'"
                [class.fa-exclamation-circle]="toast.type === 'error'" [class.fa-info-circle]="toast.type === 'info'"
                [class.fa-exclamation-triangle]="toast.type === 'warning'">
            </i>
            <span>{{ toast.message }}</span>
        </div>
        <button class="toast-close" (click)="removeToast(toast.id)">&times;</button>
    </div>
</div>
